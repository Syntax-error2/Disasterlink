name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: ./disasterlink-frontend
        run: npm install

      - name: Build Web App
        working-directory: ./disasterlink-frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./disasterlink-frontend
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        working-directory: ./disasterlink-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DisasterLink-App-Debug
          path: disasterlink-frontend/android/app/build/outputs/apk/debug/app-debug.apk
